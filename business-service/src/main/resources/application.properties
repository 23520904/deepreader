spring.application.name=business-service
server.port=${BUSINESS_SERVICE_PORT:8082}
services.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8080}
services.data-service.base-url=${DATA_SERVICE_BASE_URL:http://localhost:8081}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:business-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.deepreader.business_service.event
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
deepreader.kafka.topics.book-events=${BOOK_EVENTS_TOPIC:deepreader.book.events}
deepreader.kafka.topics.book-events-dlq=${BOOK_EVENTS_DLQ_TOPIC:deepreader.book.events.dlq}
management.endpoints.web.exposure.include=health,info,metrics,prometheus