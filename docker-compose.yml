services:
  postgres:
    image: postgres:16-alpine
    container_name: deepreader-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepreader}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${POSTGRES_DB:-deepreader}"]
      interval: 10s
      timeout: 5s
      retries: 8

  qdrant:
    image: qdrant/qdrant:latest
    container_name: deepreader-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: deepreader-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    container_name: deepreader-minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: deepreader-ai-service
    environment:
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_USE_TLS: ${QDRANT_USE_TLS:-false}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-document_chunks}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/deepreader}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INGESTION_MAX_FILE_SIZE_BYTES: ${INGESTION_MAX_FILE_SIZE_BYTES:-26214400}
      INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-3}
      GUARDRAILS_MAX_LLM_REQUESTS_PER_DAY: ${GUARDRAILS_MAX_LLM_REQUESTS_PER_DAY:-500}
      GUARDRAILS_MAX_UPLOADS_PER_DAY: ${GUARDRAILS_MAX_UPLOADS_PER_DAY:-100}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-5}
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-deepreader-documents}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "${AI_SERVICE_PORT:-8080}:8080"

volumes:
  postgres_data:
  qdrant_data:
  minio_data: