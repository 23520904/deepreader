services:
  haystack-service:
    build:
      context: .
      dockerfile: haystack-service/Dockerfile
    container_name: deepreader-haystack-service
    environment:
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-document_chunks}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
    ports:
      - "${HAYSTACK_PORT:-8000}:8000"

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: deepreader-ai-service
    environment:
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HAYSTACK_BASE_URL: ${HAYSTACK_BASE_URL:-http://haystack-service:8000}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_USE_TLS: ${QDRANT_USE_TLS:-true}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-document_chunks}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      INGESTION_MAX_FILE_SIZE_BYTES: ${INGESTION_MAX_FILE_SIZE_BYTES:-26214400}
      INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-3}
      GUARDRAILS_MAX_LLM_REQUESTS_PER_DAY: ${GUARDRAILS_MAX_LLM_REQUESTS_PER_DAY:-500}
      GUARDRAILS_MAX_UPLOADS_PER_DAY: ${GUARDRAILS_MAX_UPLOADS_PER_DAY:-100}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-5}
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
    depends_on:
      haystack-service:
        condition: service_started
    ports:
      - "${AI_SERVICE_PORT:-8080}:8080"

  data-service:
    build:
      context: .
      dockerfile: data-service/Dockerfile
    container_name: deepreader-data-service
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: ${DEEPREADER_DATA_MONGODB_URI}
      RELATIONAL_DATABASE_URL: ${RELATIONAL_DATABASE_URL}
      RELATIONAL_DATABASE_USERNAME: ${RELATIONAL_DATABASE_USERNAME}
      RELATIONAL_DATABASE_PASSWORD: ${RELATIONAL_DATABASE_PASSWORD}
    ports:
      - "${DATA_SERVICE_PORT:-8081}:8081"

  business-service:
    build:
      context: .
      dockerfile: business-service/Dockerfile
    container_name: deepreader-business-service
    environment:
      SERVER_PORT: 8082
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8080}
      DATA_SERVICE_BASE_URL: ${DATA_SERVICE_BASE_URL:-http://data-service:8081}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SSL}
      KAFKA_SSL_CERTIFICATE_CHAIN_PATH: ${KAFKA_SSL_CERTIFICATE_CHAIN_PATH:-/etc/aiven/service.cert}
      KAFKA_SSL_KEY_PATH: ${KAFKA_SSL_KEY_PATH:-/etc/aiven/service.key}
      KAFKA_SSL_CA_CERT_PATH: ${KAFKA_SSL_CA_CERT_PATH:-/etc/aiven/ca.pem}
      BOOK_EVENTS_TOPIC: ${BOOK_EVENTS_TOPIC:-deepreader.book.events}
      BOOK_EVENTS_DLQ_TOPIC: ${BOOK_EVENTS_DLQ_TOPIC:-deepreader.book.events.dlq}
      KAFKA_CAMEL_ROUTE_ENABLED: ${KAFKA_CAMEL_ROUTE_ENABLED:-true}
    command: >
      sh -c "cat /etc/aiven/service.key /etc/aiven/service.cert > /etc/aiven/client-keystore.pem
      && java -jar /app/app.jar"
    volumes:
      - ./aiven_connect:/etc/aiven
    depends_on:
      ai-service:
        condition: service_started
      data-service:
        condition: service_started
    ports:
      - "${BUSINESS_SERVICE_PORT:-8082}:8082"

  web-module:
    build:
      context: .
      dockerfile: web-module/Dockerfile
    container_name: deepreader-web-module
    environment:
      SERVER_PORT: 8083
      BUSINESS_SERVICE_BASE_URL: ${BUSINESS_SERVICE_BASE_URL:-http://business-service:8082}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      business-service:
        condition: service_started
    ports:
      - "${WEB_MODULE_PORT:-8083}:8083"