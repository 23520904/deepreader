services:
  postgres:
    image: postgres:17-alpine
    container_name: deepreader-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepreader}
      POSTGRES_USER: ${POSTGRES_USER:-deepreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepreader}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-deepreader} -d $${POSTGRES_DB:-deepreader}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: deepreader-mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: deepreader-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: deepreader-qdrant
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  haystack-service:
    build:
      context: .
      dockerfile: haystack-service/Dockerfile
    container_name: deepreader-haystack-service
    environment:
      QDRANT_URL: ${HAYSTACK_QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${HAYSTACK_QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-document_chunks}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "${HAYSTACK_PORT:-8000}:8000"
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: deepreader-ai-service
    environment:
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HAYSTACK_BASE_URL: http://haystack-service:8000
      QDRANT_HOST: ${DOCKER_QDRANT_HOST:-qdrant}
      QDRANT_GRPC_PORT: ${DOCKER_QDRANT_GRPC_PORT:-6334}
      QDRANT_API_KEY: ${DOCKER_QDRANT_API_KEY:-}
      QDRANT_USE_TLS: ${DOCKER_QDRANT_USE_TLS:-false}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-document_chunks}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-jdbc:postgresql://postgres:5432/deepreader}
      DATABASE_USERNAME: ${DOCKER_DATABASE_USERNAME:-deepreader}
      DATABASE_PASSWORD: ${DOCKER_DATABASE_PASSWORD:-deepreader}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-redis}
      REDIS_PORT: ${DOCKER_REDIS_PORT:-6379}
      REDIS_USERNAME: ${DOCKER_REDIS_USERNAME:-}
      REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${DOCKER_REDIS_SSL_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      INGESTION_MAX_FILE_SIZE_BYTES: ${INGESTION_MAX_FILE_SIZE_BYTES:-26214400}
      INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-3}
      GUARDRAILS_MAX_LLM_REQUESTS_PER_DAY: ${GUARDRAILS_MAX_LLM_REQUESTS_PER_DAY:-500}
      GUARDRAILS_MAX_UPLOADS_PER_DAY: ${GUARDRAILS_MAX_UPLOADS_PER_DAY:-100}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-5}
      STORAGE_ENABLED: ${DOCKER_STORAGE_ENABLED:-false}
      STORAGE_ENDPOINT: ${DOCKER_STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${DOCKER_STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${DOCKER_STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${DOCKER_STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${DOCKER_STORAGE_BUCKET:-deepreader-documents}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      haystack-service:
        condition: service_started
    ports:
      - "${AI_SERVICE_HOST_PORT:-18080}:8080"
    restart: unless-stopped

  data-service:
    build:
      context: .
      dockerfile: data-service/Dockerfile
    container_name: deepreader-data-service
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/deepreader}
      RELATIONAL_DATABASE_URL: ${DOCKER_RELATIONAL_DATABASE_URL:-jdbc:postgresql://postgres:5432/deepreader}
      RELATIONAL_DATABASE_USERNAME: ${DOCKER_RELATIONAL_DATABASE_USERNAME:-deepreader}
      RELATIONAL_DATABASE_PASSWORD: ${DOCKER_RELATIONAL_DATABASE_PASSWORD:-deepreader}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "${DATA_SERVICE_HOST_PORT:-18081}:8081"
    restart: unless-stopped

  business-service:
    build:
      context: .
      dockerfile: business-service/Dockerfile
    container_name: deepreader-business-service
    environment:
      SERVER_PORT: 8082
      AI_SERVICE_BASE_URL: http://ai-service:8080
      DATA_SERVICE_BASE_URL: http://data-service:8081
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SSL}
      KAFKA_SSL_KEYSTORE_LOCATION: ${KAFKA_SSL_KEYSTORE_LOCATION:-/etc/aiven/client-keystore.pem}
      KAFKA_SSL_CERTIFICATE_CHAIN_PATH: ${KAFKA_SSL_CERTIFICATE_CHAIN_PATH:-/etc/aiven/service.cert}
      KAFKA_SSL_KEY_PATH: ${KAFKA_SSL_KEY_PATH:-/etc/aiven/service.key}
      KAFKA_SSL_CA_CERT_PATH: ${KAFKA_SSL_CA_CERT_PATH:-/etc/aiven/ca.pem}
      BOOK_EVENTS_TOPIC: ${BOOK_EVENTS_TOPIC:-deepreader.book.events}
      BOOK_EVENTS_DLQ_TOPIC: ${BOOK_EVENTS_DLQ_TOPIC:-deepreader.book.events.dlq}
      KAFKA_CAMEL_ROUTE_ENABLED: ${DOCKER_KAFKA_CAMEL_ROUTE_ENABLED:-false}
      KAFKA_PUBLISHER_ENABLED: ${DOCKER_KAFKA_PUBLISHER_ENABLED:-false}
    volumes:
      - ./aiven_connect:/etc/aiven
    depends_on:
      ai-service:
        condition: service_started
      data-service:
        condition: service_started
    ports:
      - "${BUSINESS_SERVICE_HOST_PORT:-18082}:8082"
    restart: unless-stopped

  web-module:
    build:
      context: .
      dockerfile: web-module/Dockerfile
    container_name: deepreader-web-module
    environment:
      SERVER_PORT: 8083
      BUSINESS_SERVICE_BASE_URL: http://business-service:8082
      DATABASE_URL: ${DOCKER_DATABASE_URL:-jdbc:postgresql://postgres:5432/deepreader}
      DATABASE_USERNAME: ${DOCKER_DATABASE_USERNAME:-deepreader}
      DATABASE_PASSWORD: ${DOCKER_DATABASE_PASSWORD:-deepreader}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-redis}
      REDIS_PORT: ${DOCKER_REDIS_PORT:-6379}
      REDIS_USERNAME: ${DOCKER_REDIS_USERNAME:-}
      REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${DOCKER_REDIS_SSL_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-secret-32-bytes-minimum}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
      business-service:
        condition: service_started
    ports:
      - "${WEB_MODULE_HOST_PORT:-8083}:8083"
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  qdrant_storage:
