spring.application.name=ai-service
deepreader.llm.provider=${LLM_PROVIDER:gemini}

deepreader.openai.api-key=${OPENAI_API_KEY:}
deepreader.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
deepreader.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
deepreader.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

deepreader.groq.api-key=${GROQ_API_KEY:}
deepreader.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
deepreader.groq.chat-model=${GROQ_CHAT_MODEL:llama-3.1-8b-instant}

deepreader.gemini.api-key=${GEMINI_API_KEY:}
deepreader.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
deepreader.gemini.generation-model=${GEMINI_GENERATION_MODEL:gemini-2.0-flash}
deepreader.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
deepreader.gemini.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
deepreader.gemini.embedding-batch-size=${GEMINI_EMBEDDING_BATCH_SIZE:50}
deepreader.gemini.embedding-batch-delay-ms=${GEMINI_EMBEDDING_BATCH_DELAY_MS:32000}
deepreader.gemini.embedding-max-retries=${GEMINI_EMBEDDING_MAX_RETRIES:5}
deepreader.gemini.embedding-retry-delay-ms=${GEMINI_EMBEDDING_RETRY_DELAY_MS:15000}

deepreader.qdrant.host=${QDRANT_HOST:}
deepreader.qdrant.grpc-port=${QDRANT_GRPC_PORT:6334}
deepreader.qdrant.api-key=${QDRANT_API_KEY:}
deepreader.qdrant.use-tls=${QDRANT_USE_TLS:true}
deepreader.qdrant.collection-prefix=${QDRANT_COLLECTION_PREFIX:document_chunks}
deepreader.qdrant.timeout-seconds=${QDRANT_TIMEOUT_SECONDS:10}
deepreader.haystack.base-url=${HAYSTACK_BASE_URL:http://localhost:8000}

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
spring.data.redis.timeout=2s

deepreader.ingestion.max-file-size-bytes=${INGESTION_MAX_FILE_SIZE_BYTES:26214400}

deepreader.pdf-vision.max-images=${PDF_VISION_MAX_IMAGES:16}
deepreader.pdf-vision.max-text-chars=${PDF_VISION_MAX_TEXT_CHARS:100000}
deepreader.pdf-vision.min-image-side-pixels=${PDF_VISION_MIN_IMAGE_SIDE_PX:32}
deepreader.pdf-vision.max-image-bytes=${PDF_VISION_MAX_IMAGE_BYTES:4194304}
deepreader.pdf-vision.fallback-render-pages-if-no-images=${PDF_VISION_FALLBACK_RENDER_PAGES:true}
deepreader.pdf-vision.max-pages-to-render=${PDF_VISION_MAX_PAGES_TO_RENDER:8}
deepreader.pdf-vision.render-dpi=${PDF_VISION_RENDER_DPI:100}
deepreader.ingestion.max-retries=${INGESTION_MAX_RETRIES:3}
deepreader.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
deepreader.guardrails.max-llm-requests-per-day=${GUARDRAILS_MAX_LLM_REQUESTS_PER_DAY:500}
deepreader.guardrails.max-uploads-per-day=${GUARDRAILS_MAX_UPLOADS_PER_DAY:100}
deepreader.worker.enabled=${WORKER_ENABLED:true}
deepreader.worker.poll-interval-ms=${WORKER_POLL_INTERVAL_MS:5000}
deepreader.worker.batch-size=${WORKER_BATCH_SIZE:5}
deepreader.retention.audit-days=${RETENTION_AUDIT_DAYS:30}
deepreader.retention.dead-letter-days=${RETENTION_DEAD_LETTER_DAYS:30}
deepreader.retention.session-days=${RETENTION_SESSION_DAYS:30}
deepreader.retention.usage-days=${RETENTION_USAGE_DAYS:90}
deepreader.storage.enabled=${STORAGE_ENABLED:false}
deepreader.storage.endpoint=${STORAGE_ENDPOINT:}
deepreader.storage.region=${STORAGE_REGION:us-east-1}
deepreader.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
deepreader.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
deepreader.storage.bucket=${STORAGE_BUCKET:deepreader-documents}
deepreader.storage.path-style=${STORAGE_PATH_STYLE:true}
deepreader.storage.local-directory=${STORAGE_LOCAL_DIRECTORY:data/documents}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


spring.codec.max-in-memory-size=${SPRING_CODEC_MAX_IN_MEMORY_SIZE:32MB}
