name: dependency-hygiene

on:
  pull_request:
    paths:
      - "**/pom.xml"
      - ".github/workflows/dependency-hygiene.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Dependency analyze (all modules)
        run: |
          set -e
          mkdir -p target/dependency-hygiene
          modules=("core" "ai-service" "business-service" "data-service" "web-module")
          for module in "${modules[@]}"; do
            mvn -pl "$module" -DskipTests dependency:analyze | tee "target/dependency-hygiene/${module}.txt"
          done
      - name: Check unused declared dependencies
        run: |
          set -e
          if grep -R "Unused declared dependencies found" target/dependency-hygiene; then
            echo "Unused declared dependencies detected"
            exit 1
          fi
