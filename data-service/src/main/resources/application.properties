spring.application.name=data-service
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/deepreader}
server.port=${DATA_SERVICE_PORT:8081}
spring.datasource.url=${RELATIONAL_DATABASE_URL:jdbc:postgresql://localhost:5432/deepreader}
spring.datasource.username=${RELATIONAL_DATABASE_USERNAME:postgres}
spring.datasource.password=${RELATIONAL_DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.table=flyway_schema_history_data
management.endpoints.web.exposure.include=health,info,metrics,prometheus

