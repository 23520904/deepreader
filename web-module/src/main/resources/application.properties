spring.application.name=web-module
server.port=${WEB_MODULE_PORT:8083}
services.business-service.base-url=${BUSINESS_SERVICE_BASE_URL:http://localhost:8082}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/deepreader}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
deepreader.auth.jwt.secret=${JWT_SECRET:dev-change-me-secret-32-bytes-minimum}
deepreader.auth.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
deepreader.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
deepreader.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
deepreader.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:600}
management.endpoints.web.exposure.include=health,info,metrics,prometheus