spring.application.name=web-module
server.port=${WEB_MODULE_PORT:8083}
services.business-service.base-url=${BUSINESS_SERVICE_BASE_URL:http://localhost:8082}
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.flyway.enabled=${WEB_MODULE_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.table=web_module_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${WEB_MODULE_FLYWAY_BASELINE_VERSION:0}
spring.flyway.validate-on-migrate=true
spring.codec.max-in-memory-size=${SPRING_CODEC_MAX_IN_MEMORY_SIZE:32MB}
spring.sql.init.mode=never
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
deepreader.auth.jwt.secret=${JWT_SECRET:dev-change-me-secret-32-bytes-minimum}
deepreader.auth.jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
deepreader.auth.google.client-id=${GOOGLE_CLIENT_ID:}
deepreader.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
deepreader.auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
deepreader.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
deepreader.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
deepreader.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:600}
deepreader.mail.from=${SMTP_FROM:DeepReader <noreply@deepreader.local>}
deepreader.email-verification.otp-ttl-minutes=${EMAIL_VERIFICATION_OTP_TTL_MINUTES:10}
deepreader.email-verification.resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
deepreader.email-verification.max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
deepreader.password-reset.otp-ttl-minutes=${PASSWORD_RESET_OTP_TTL_MINUTES:10}
deepreader.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
